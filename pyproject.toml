[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timemachine"
version = "0.1.0"
description = "TIME MACHINE — sistema agentico + GenUI per i turni di un punto vendita GDO (pilota: Le Rocce)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.41",
    "jinja2>=3.1",
    "bcrypt>=4.1",
    "cryptography>=42",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tm = "timemachine.cli:main"

[tool.setuptools.packages.find]
include = ["timemachine*"]

[tool.setuptools.package-data]
"timemachine.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
