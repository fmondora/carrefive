{% extends "base.html" %}
{% block titolo %}Password dimenticata — Le Rocce{% endblock %}

{% block corpo %}
<main class="landing">
  <h1>Rientra</h1>
  <p class="meta">Ti mandiamo un link sull'email con cui sei già dentro. Non crea account nuovi.</p>

  <section class="card">
    {% if messaggio %}<p>{{ messaggio }}</p>{% endif %}
    <form method="post" action="/password-dimenticata">
      <label class="campo">
        <span class="etichetta">uid o email</span>
        <input type="text" name="uid" autocomplete="username" required>
      </label>
      <button class="chip chip--primaria">mandami il link</button>
    </form>
  </section>

  <p class="meta"><a href="/">torna al login</a></p>
</main>
{% endblock %}
